name: Python Runtime Contract

on:
  pull_request:
    paths:
      - '.github/workflows/python_runtime_contract.yml'
      - 'README.md'
      - 'requirements.txt'
      # The job runs the whole admin/test/scripts suite, so trigger on all of it
      - 'admin/test/scripts/**'
      # The suite imports every artifact module, which is the only check that a
      # change parses on the oldest supported Python. Without this the job could
      # not see changes under scripts/, and a 3.12-only f-string shipped broken
      # on 3.10/3.11 until it blocked unrelated pull requests (see #986).
      - 'scripts/**'
      # The entry points are covered by the same suite and are equally able to
      # break on an older Python
      - 'aleapp.py'
      - 'aleappGUI.py'
      # The entry points and scripts/ilapfuncs.py import leapp_functions, so a
      # change there is equally able to break on an older Python
      - 'leapp_functions/**'
      # test_packaging_build.py loads packaging/build.py, the entry point and the spec
      - 'packaging/**'
      # ...and checks requirements-msl-lock.txt against requirements.txt
      - 'requirements-msl-lock.txt'
      # every job installs through this script
      - 'admin/scripts/install_requirements.py'
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions README.md tells users to run
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: python admin/scripts/install_requirements.py

      - name: Run admin compatibility tests
        run: python -m unittest discover -s admin/test/scripts -p 'test_*.py'

  install:
    # README promises these versions. On Windows, x64 and ARM64, they must
    # install with no compiler: only the pure-Python packages that publish no
    # wheels may build from source, so a compiled package without a wheel on
    # PyPI or in whl_files fails here. Windows ARM64 Python starts at 3.11 in
    # setup-python. On pull requests the mister_skinnylegs chain comes from
    # requirements-msl-lock.txt (admin/scripts/install_requirements.py), so a
    # broken push to a ccl reader's default branch cannot fail every PR, and the
    # job fails if Brotli is older than 1.2.1. The weekly run installs as users
    # do: mister_skinnylegs installs its ccl readers from their git default
    # branches, and they pin lz4, zstd and Brotli, so it catches a pin that
    # moves away from the wheels in whl_files or an upstream install that breaks.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - { os: windows-11-arm, python-version: '3.11' }
          - { os: windows-11-arm, python-version: '3.12' }
          - { os: windows-11-arm, python-version: '3.13' }
          - { os: windows-11-arm, python-version: '3.14' }
          - { os: windows-11-arm, python-version: '3.15' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies from wheels with the lock (Windows)
        if: runner.os == 'Windows' && github.event_name != 'schedule'
        run: |
          python admin/scripts/install_requirements.py --only-binary=:all: --no-binary=mister-skinnylegs,ccl-chromium-reader,ccl-mozilla-reader,ccl-simplesnappy

      - name: Install runtime dependencies with the lock (macOS)
        if: runner.os == 'macOS' && github.event_name != 'schedule'
        run: |
          python admin/scripts/install_requirements.py

      - name: Install runtime dependencies from wheels as users do (Windows, weekly)
        if: runner.os == 'Windows' && github.event_name == 'schedule'
        run: |
          python -m pip install --only-binary=:all: --no-binary=mister-skinnylegs,ccl-chromium-reader,ccl-mozilla-reader,ccl-simplesnappy -r requirements.txt

      - name: Install runtime dependencies as users do (macOS, weekly)
        if: runner.os == 'macOS' && github.event_name == 'schedule'
        run: |
          python -m pip install -r requirements.txt

      - name: Import the compiled dependencies
        run: |
          python -c "import sqlcipher3, bcrypt, lz4.block, zstd, brotli, PIL, Crypto, google.protobuf, fitdecode, xlsxwriter; print('ok')"
