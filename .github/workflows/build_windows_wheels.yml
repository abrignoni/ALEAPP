name: Build Windows wheels

# Builds the Windows wheels kept in whl_files/ for the Python versions and
# machines PyPI carries no wheel for, so a Windows install needs no compiler.
# Each package is built from its PyPI sdist, checked against the pinned
# sha256, then installed into a clean venv and exercised before upload.
# Download the artifacts and commit the wheels by hand, with a requirements.txt
# line for each. Same workflow as iLEAPP's, with this core's packages.
#
# Gaps covered, measured against PyPI on 2026-10-19:
#   sqlcipher3 0.6.2: no cp315 wheel, x64 or ARM64.
#   lz4 4.3.3, zstd 1.5.7.2 and Brotli 1.2.0, pinned by the ccl readers that
#   mister_skinnylegs installs from git: lz4 has x64 wheels only to 3.12, zstd
#   only to 3.13, Brotli only to 3.14, and none of the three has ARM64 wheels.
#   lz4 4.3.3's lz4.frame does not import from Python 3.14; the reader uses
#   lz4.block, which does, so that is what the check exercises.
# setup-python offers Windows ARM64 builds of Python from 3.11 only.

on:
  # A change to this file rebuilds and checks every wheel.
  pull_request:
    paths:
      - '.github/workflows/build_windows_wheels.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.name }} ${{ matrix.arch }} ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
