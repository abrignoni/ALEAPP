    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - name: Download and verify the sdist
        shell: bash
        run: |
          curl -sSfL -o sdist.tar.gz "${{ matrix.sdist }}"
          echo "${{ matrix.sha256 }}  sdist.tar.gz" | sha256sum -c -

      - name: Build the wheel
        shell: bash
        run: python -m pip wheel --no-deps --wheel-dir dist sdist.tar.gz

      - name: Install into a clean venv and exercise it
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          python -m venv check
          check/Scripts/python -m pip install --quiet --no-index dist/*.whl
          printf '%s\n' "$CHECK" > check.py
          check/Scripts/python check.py
          check/Scripts/python -c "import platform, sys; print(sys.version, platform.machine())"
          sha256sum dist/*.whl
          python -m zipfile -l dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-${{ matrix.version }}-py${{ matrix.python }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error
