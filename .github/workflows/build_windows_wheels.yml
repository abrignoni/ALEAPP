            version: 0.6.2
            runner: windows-latest
            arch: x64
            python: '3.15'
            sdist: https://files.pythonhosted.org/packages/ae/c1/414003d77549c444bafd636149ab3ace6f4e2cb4666c9955d54ad62096cb/sqlcipher3-0.6.2.tar.gz
            sha256: a2b675289ba8889f389625a21f3a01f1ff159a551b5b88fba8fd92da0e02380a
            check: |
              import os, tempfile
              from sqlcipher3 import dbapi2 as sqlcipher
              path = os.path.join(tempfile.mkdtemp(), 'check.db')
              db = sqlcipher.connect(path)
              db.execute("PRAGMA key = 'right'")
              db.execute('CREATE TABLE t (x TEXT)')
              db.execute("INSERT INTO t VALUES ('hello')")
              db.commit()
              db.close()
              with open(path, 'rb') as f:
                  assert f.read(16) != b'SQLite format 3\x00', 'database is not encrypted'
              db = sqlcipher.connect(path)
              db.execute("PRAGMA key = 'right'")
              assert db.execute('SELECT x FROM t').fetchone()[0] == 'hello'
              print('cipher_version', db.execute('PRAGMA cipher_version').fetchone()[0])
              db.close()
              db = sqlcipher.connect(path)
              db.execute("PRAGMA key = 'wrong'")
              try:
                  db.execute('SELECT x FROM t').fetchone()
                  raise SystemExit('a wrong key read the database')
              except sqlcipher.DatabaseError:
                  pass
